apiVersion: v1
kind: ServiceAccount
metadata:
  name: jottacloud-backup-sa
  namespace: jottacloud-backup
  labels:
    app: jottacloud-backup
automountServiceAccountToken: false  # Don't mount token unless needed
---
# Role with minimal permissions for backup operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: jottacloud-backup
  name: jottacloud-backup-role
rules: []
---
# Bind the role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jottacloud-backup-rolebinding
  namespace: jottacloud-backup
subjects:
- kind: ServiceAccount
  name: jottacloud-backup-sa
  namespace: jottacloud-backup
roleRef:
  kind: Role
  name: jottacloud-backup-role
  apiGroup: rbac.authorization.k8s.io