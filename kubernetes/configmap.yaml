apiVersion: v1
kind: ConfigMap
metadata:
  name: jottacloud-backup-config
  namespace: jottacloud-backup
data:
  # Backup configuration
  # Schedule is set in cronjob.yaml spec.schedule (45 */6 * * *)
  TZ: "UTC"

  # Rclone configuration
  RCLONE_LOG_LEVEL: "INFO"
  RCLONE_CONFIG_FILE: "/config/rclone.conf"
  JOTTA_REMOTE: "jotta"
  LOCAL_PATH: "/data/jotta"
  # Optional encryption at rest (see README "Encryption at rest"): define a
  # crypt remote wrapping LOCAL_PATH entirely via env vars - rclone.conf and
  # the rotating Jottacloud token inside it are never touched. The password
  # arrives via the secret key RCLONE_CONFIG_JOTTACRYPT_PASSWORD (obscured
  # form, from `rclone obscure`).
  # RCLONE_CONFIG_JOTTACRYPT_TYPE: "crypt"
  # RCLONE_CONFIG_JOTTACRYPT_REMOTE: "/data/jotta"
  # RCLONE_CONFIG_JOTTACRYPT_FILENAME_ENCRYPTION: "off"
  # DEST_REMOTE: "jottacrypt"

  # Kopia configuration
  KOPIA_CONFIG_FILE: "/config/kopia.config"
  KOPIA_CACHE_DIR: "/config/cache"
  KOPIA_LOG_DIR: "/data/logs/kopia"
  KOPIA_USERNAME: "backup"
  KOPIA_HOSTNAME: "jotta-backup-client"
  SOURCE_PATH: "/data/jotta"

  # S3 configuration for Backblaze B2
  S3_ENDPOINT: "s3.eu-central-003.backblazeb2.com"
  S3_BUCKET: "cloud-files-backup"
  S3_REGION: "eu-central-003"

  # Healthcheck configuration
  HEALTHCHECK_URL: "https://hc-ping.com"
  HEALTHCHECK_UUID: ""  # Set to your healthchecks.io check UUID

  # Resource limits for backup jobs
  BACKUP_TIMEOUT: "6h"
  MAX_PARALLEL_UPLOADS: "4"
